[project]
name = "chemformer"
readme = "README.md"
requires-python = ">=3.10.0,<3.11.0"
# bumped to 2.3 for Python 3.8->3.10
version = "2.3.0"
description = "Smiles-based synthesis prediction."
authors = [
    {name = "Irwin, Ross", email = "ross.irwin1@astrazeneca.com"},
    {name = "Westerlund, Annie <annie.westerlund@astrazeneca.com>"},
    {name = "Saigiridharan, Lakshidaa", email="lakshidaa.saigiridharan@astrazeneca.com"},
    {name = "Peter Hartog", email="peter.hartog@astrazeneca.com"},
    {name = "Genheden, Samuel", email="samuel.genheden@astrazeneca.com"},
    ]
license = "Apache-2.0"

dependencies = [
    # dotenv added by Hobson 2026
    "dotenv",
    "rdkit==2022.9.3",
    # "torch==1.8.1",
    "torch==1.13.1",  
    # "torch>=1.10.0,<2.0.0",  # cp310 wheels available from PyTorch wheel index (not standard PyPI)
    # "pytorch-lightning==1.2.3",  # ,<1.3.0",
    # "pytorch-lightning>=1.2.0,<1.5.0",
    "pytorch-lightning==1.4.9",
    "torchmetrics>=0.4.0,<0.8.0",  # 0.8.0 removed get_num_classes used by pytorch-lightning 1.4.x
    "numpy>=1.21.0,<2.0.0",  # torch 1.x binaries compiled against numpy 1.x
    #    "pysmilesutils",  #  = { git==https://github.com/MolecularAI/pysmilesutils.git" }
    "hydra-core>=1.3.2",  #  ">=1.3.2,<1.5.0",
    # "hydra-colorlog>=1.2.0,<1.3.0",
    # "hydra-optuna-sweeper>=1.2.0,<1.3.0",
    "fastapi==0.98.0",  # ,<0.99.0",
    "pydantic",  # ,<=2.0",
    # "deepspeed",
    "pandas>=1.4.0",
    "protobuf>=2.0,<3.21",
    # "ipython",
    "ipython>=7.34.0",
]

[project.optional-dependencies]
all = [
    "chemformer[dev,data,service]",
    ]

service = [
    "uvicorn[standard]>=0.22.0",
    "google-cloud-storage>=2.0,<3.0",
]

dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
    "mypy",
    "pytest-mock>=3.10.0",
    "pytest-datadir>=1.4.1",
]

# installs numpy >= 2.0 which breaks molbart.predict
data = [
    "jupyter",
#     "tdc",  # depends on blis which must be built from source
    "wandb>=0.16.5",
    "textbrewer>=0.2.1.post1",
    "eco2ai",
]

[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"

[tool.uv_build]
source-dir = "src"

[tool.black]
line-length = 120

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only used for packages listed in [tool.uv.sources]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
